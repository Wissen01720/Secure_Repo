name: Publish to PyPI

# Runs only when a GitHub release is published. It uses PyPI "Trusted Publishing" (OpenID Connect): no API token
# is stored anywhere. One-time setup is described in docs/releasing.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: The release tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('secure_repo/__init__.py').read_text()).group(1))")"
          if [ "v$version" != "$TAG" ]; then
            echo "Release tag $TAG does not match the package version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/secure-repo
    permissions:
      id-token: write   # the only place that needs it: Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
