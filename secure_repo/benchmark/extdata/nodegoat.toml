name = "nodegoat"
repo = "https://github.com/OWASP/NodeGoat.git"
commit = "c5cb68a7084e4ae7dcc60e6a98768720a81841e8"
kind = "vulnerable"
language = "JavaScript"
description = "OWASP NodeGoat: Node.js / Express application that is vulnerable on purpose (OWASP Top 10)."

# ------------------------------------------------------------------ weaknesses that exist in the code (recall)
[[known]]
id = "NG-01"
title = "eval() on request body"
file = "app/routes/contributions.js"
line = 32
cwe = "CWE-95"
rules = ["SR-JS-001"]

[[known]]
id = "NG-02"
title = "NoSQL injection through $where"
file = "app/data/allocations-dao.js"
line = 78
cwe = "CWE-943"
rules = ["SR-GEN-009"]

[[known]]
id = "NG-03"
title = "Open redirect from req.query.url"
file = "app/routes/index.js"
line = 72
cwe = "CWE-601"
rules = ["SR-JS-018"]

[[known]]
id = "NG-04"
title = "SSRF: needle.get() on a URL built from req.query (data flows through a variable)"
file = "app/routes/research.js"
line = 16
cwe = "CWE-918"
rules = ["SR-JS-017"]

[[known]]
id = "NG-05"
title = "Hardcoded session cookie secret"
