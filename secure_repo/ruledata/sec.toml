# Detection rules with the ID prefix SR-SEC-*.
# Edit here, not in Python. Every rule needs at least one positive and one negative example
# (tests/test_rules_data.py runs them): a positive must raise the rule, a negative must not.

[[rule]]
id = 'SR-SEC-001'
title = 'AWS access key ID'
severity = 'critical'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
confidence = 'high'
exclude = 'EXAMPLE'
keywords = ['akia', 'asia', 'agpa', 'aida', 'aroa', 'anpa', 'anva', 'aipa']
tags = ['secrets']
scan_comments = true
redact = true
pattern = '\b((?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA|AIPA)[0-9A-Z]{16})\b'
description = 'An Amazon Web Services access key identifier is embedded in the repository. Anyone with read access to the code (or its history, forks and CI logs) can pair it with the secret key to act on your AWS account, leading to data theft or large unexpected bills.'
recommendation = 'Revoke and rotate this credential immediately, remove it from the source code and the Git history (e.g. git filter-repo), and load it at runtime from a secret manager or environment variable that is never committed.'

[[rule.example]]
kind = 'positive'
code = '''AWS_ACCESS_KEY_ID = "AKIA<<upper:16>>"
'''

[[rule.example]]
kind = 'negative'
code = '''import os

VALUE = os.environ["SECRET_VALUE"]
'''

[[rule]]
id = 'SR-SEC-002'
title = 'AWS secret access key'
severity = 'critical'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
exclude = '(?i)EXAMPLEKEY|[0-9a-f]{40}'
keywords = ['aws']
tags = ['secrets']
scan_comments = true
redact = true
pattern = '''(?i)aws.{0,25}?['\"]([0-9a-zA-Z/+]{40})['\"]'''
description = 'A 40-character value assigned near an AWS identifier looks like an AWS secret access key. Secret keys grant full programmatic access with the permissions of the owning IAM identity.'
recommendation = 'Revoke and rotate this credential immediately, remove it from the source code and the Git history (e.g. git filter-repo), and load it at runtime from a secret manager or environment variable that is never committed.'

[[rule.example]]
kind = 'positive'
code = '''aws_secret_access_key = "<<alnum:40>>"
'''

[[rule.example]]
kind = 'negative'
code = '''aws_region = "us-east-1"
'''

