[[rule]]
id = 'SR-SEC-009'
title = 'Private key material'
severity = 'critical'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
confidence = 'high'
keywords = ['private key']
tags = ['secrets']
scan_comments = true
pattern = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
description = 'A private key (TLS, SSH, PGP or signing key) is stored in the repository. Whoever obtains it can impersonate your servers, decrypt traffic or sign malicious artifacts.'
recommendation = 'Treat the key as compromised: revoke/replace it, remove it from history, and store keys in a hardware module, key vault or CI secret store.'

[[rule.example]]
kind = 'positive'
file = 'notes.txt'
code = '''-----BEGIN <<lit:RSA >>PRIVATE KEY-----
<<b64url:64>>
-----END <<lit:RSA >>PRIVATE KEY-----
'''

[[rule.example]]
kind = 'negative'
file = 'notes.txt'
code = '''This file explains how to generate a key pair; it contains no key.
'''

