[[rule]]
id = 'SR-SEC-011'
title = 'Credentials inside a connection string'
severity = 'high'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
confidence = 'high'
exclude = '(?i)://[^:\s]*:(?:\$\{|\{\{|<|%\(|password@|pass@|passwd@|pwd@|secret@|\*+@|x+@|changeme|example)'
keywords = ['://']
tags = ['secrets']
scan_comments = true
redact = true
pattern = '''(?i)\b(?:mongodb(?:\+srv)?|postgres(?:ql)?|mysql|mariadb|rediss?|amqps?|mssql|sqlserver|ftp|sftp|smtp)://[^:\s/'\"@]+:([^@\s'\"/]{3,})@'''
description = 'A database / broker URI contains a username and password. The credentials are readable by anyone with access to the repository and usually reach production data stores.'
recommendation = 'Revoke and rotate this credential immediately, remove it from the source code and the Git history (e.g. git filter-repo), and load it at runtime from a secret manager or environment variable that is never committed.'

[[rule.example]]
kind = 'positive'
code = '''DATABASE_URL = "postgres://admin:<<alnum:12>>@db.internal:5432/app"
'''

[[rule.example]]
kind = 'negative'
code = '''DATABASE_URL = "postgres://db.internal:5432/app"
'''

