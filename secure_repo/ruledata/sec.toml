[[rule]]
id = 'SR-SEC-018'
title = 'Credentials embedded in URL'
severity = 'high'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
confidence = 'high'
exclude = '(?i)://[^:\s]*:(?:\$\{|\{\{|<|%\(|password@|pass@|token@|\*+@|x+@|changeme)'
keywords = ['://']
tags = ['secrets']
scan_comments = true
redact = true
pattern = '''\bhttps?://[^\s:/@'\"]+:([^\s:/@'\"]{3,})@[^\s'\"]+'''
description = 'HTTP basic-auth credentials are embedded in a URL. URLs are logged by proxies, browsers and CI systems, spreading the credential far beyond the code base.'
recommendation = 'Revoke and rotate this credential immediately, remove it from the source code and the Git history (e.g. git filter-repo), and load it at runtime from a secret manager or environment variable that is never committed.'

[[rule.example]]
kind = 'positive'
code = '''REMOTE = "https://deploy:<<alnum:12>>@git.example.org/repo.git"
'''

[[rule.example]]
kind = 'negative'
code = '''REMOTE = "https://git.example.org/repo.git"
'''

[[rule]]
id = 'SR-SEC-019'
title = 'Hardcoded credential'
severity = 'high'
category = 'Secrets'
cwe = 'CWE-798'
owasp = 'A07'
languages = ["*"]
source = 'secret'
tags = ['secrets']
redact = true
description = 'A variable whose name indicates a password, token or secret is assigned a literal value. Hardcoded credentials cannot be rotated without a code change, are shared with everyone who can read the repository and frequently end up in public forks, logs and build artifacts.'
recommendation = 'Remove the literal, rotate the credential and read it at runtime from environment variables or a secret manager (Vault, AWS/GCP/Azure secret services, Doppler, 1Password, etc.). Add a pre-commit secret scanner to prevent regressions.'

[[rule.example]]
kind = 'positive'
code = '''DB_PASSWORD = "<<alnum:16>>"
'''

[[rule.example]]
kind = 'negative'
code = '''import os

DB_PASSWORD = os.environ["DB_PASSWORD"]
'''

[[rule]]
id = 'SR-SEC-020'
title = 'Sensitive file committed to the repository'
severity = 'high'
category = 'Secrets'
cwe = 'CWE-538'
owasp = 'A05'
languages = ["*"]
source = 'secret'
tags = ['secrets']
description = 'A file that typically stores secrets (environment files, private keys, keystores, credential stores, database dumps or infrastructure state) is tracked in the repository. Its contents are exposed to anyone with read access and persist in the Git history even after deletion.'
recommendation = 'Delete the file from the repository and its history, rotate any secret it contained, add the pattern to .gitignore and distribute a sanitized template (e.g. .env.example) instead.'

[[rule.example]]
kind = 'positive'
file = '.env'
code = '''MODE=production
'''

[[rule.example]]
kind = 'negative'
file = '.env.example'
code = '''MODE=production
'''

